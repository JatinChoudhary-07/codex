<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Clock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo Clock</h1>
      <p id="clock" class="clock" aria-live="polite">--:--:--</p>

      <form id="todo-form" class="todo-form">
        <label for="todo-input" class="sr-only">Add a task</label>
        <input id="todo-input" type="text" placeholder="Add a task..." maxlength="120" required />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-label="Todo items"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
